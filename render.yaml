services:
  - type: web
    name: papercup-blog
    runtime: node
    region: singapore
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build
    startCommand: npm start
    healthCheckPath: /api/stats
    disk:
      name: papercup-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
